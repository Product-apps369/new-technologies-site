<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="map-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f8fc"/>
      <stop offset="100%" stop-color="#e4eef5"/>
    </linearGradient>
    <filter id="map-pin-shadow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="900" height="420" fill="url(#map-bg)"/>

  <!-- streets: two minor + one main avenue each way -->
  <rect x="0" y="94" width="900" height="14" fill="#dfe8ee"/>
  <rect x="0" y="204" width="900" height="18" fill="#d3e0e8"/>
  <rect x="0" y="314" width="900" height="14" fill="#dfe8ee"/>
  <rect x="194" y="0" width="14" height="420" fill="#dfe8ee"/>
  <rect x="424" y="0" width="18" height="420" fill="#d3e0e8"/>
  <rect x="644" y="0" width="14" height="420" fill="#dfe8ee"/>

  <!-- city blocks -->
  <g stroke="#d7e4ee" stroke-width="2">
    <rect x="6" y="6" width="188" height="88" rx="6" fill="#ffffff"/>
    <rect x="208" y="6" width="216" height="88" rx="6" fill="#ffffff"/>
    <rect x="442" y="6" width="202" height="88" rx="6" fill="#ffffff"/>
    <rect x="658" y="6" width="236" height="88" rx="6" fill="#cfe8d2" stroke="#bcdcc0"/>

    <rect x="6" y="108" width="188" height="96" rx="6" fill="#ffffff"/>
    <rect x="208" y="108" width="216" height="96" rx="6" fill="#e4f4f8" stroke="#c9e6ee"/>
    <rect x="442" y="108" width="202" height="96" rx="6" fill="#ffffff"/>
    <rect x="658" y="108" width="236" height="96" rx="6" fill="#ffffff"/>

    <rect x="6" y="222" width="188" height="92" rx="6" fill="#cfe8d2" stroke="#bcdcc0"/>
    <rect x="208" y="222" width="216" height="92" rx="6" fill="#ffffff"/>
    <rect x="442" y="222" width="202" height="92" rx="6" fill="#ffffff"/>
    <rect x="658" y="222" width="236" height="92" rx="6" fill="#ffffff"/>

    <rect x="6" y="328" width="188" height="86" rx="6" fill="#ffffff"/>
    <rect x="208" y="328" width="216" height="86" rx="6" fill="#ffffff"/>
    <rect x="442" y="328" width="202" height="86" rx="6" fill="#ffffff"/>
    <rect x="658" y="328" width="236" height="86" rx="6" fill="#ffffff"/>
  </g>

  <!-- points of interest along the streets -->
  <g>
    <circle cx="201" cy="101" r="6" fill="#2d6bb3" opacity=".8"/>
    <circle cx="201" cy="101" r="11" fill="none" stroke="#2d6bb3" stroke-width="2" opacity=".4"/>
    <circle cx="651" cy="321" r="6" fill="#2d6bb3" opacity=".8"/>
    <circle cx="651" cy="321" r="11" fill="none" stroke="#2d6bb3" stroke-width="2" opacity=".4"/>
    <circle cx="433" cy="101" r="6" fill="#2d6bb3" opacity=".8"/>
    <circle cx="433" cy="101" r="11" fill="none" stroke="#2d6bb3" stroke-width="2" opacity=".4"/>
  </g>

  <!-- pin marker, tip lands exactly on the main-avenue intersection -->
  <g transform="translate(-37,-43)" filter="url(#map-pin-shadow)">
    <ellipse cx="470" cy="256" rx="22" ry="7" fill="#0b2f68" opacity=".18"/>
  </g>
  <g transform="translate(-37,-43)">
    <path d="M470 164 c-24 0 -42 18 -42 42 c0 30 42 66 42 66 s42 -36 42 -66 c0 -24 -18 -42 -42 -42 z" fill="#0b2f68" stroke="#ffffff" stroke-width="4"/>
    <circle cx="470" cy="206" r="16" fill="#5ec3d6"/>
  </g>
</svg>
