name: Mirror to GitVerse

on:
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to GitVerse
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_USER: ${{ vars.GITVERSE_USER }}
          GITVERSE_REPO: ${{ vars.GITVERSE_REPO }}
        run: |
          git remote add gitverse "https://${GITVERSE_USER}:${GITVERSE_TOKEN}@gitverse.ru/${GITVERSE_REPO}.git"
          git push gitverse HEAD:main --force
